[project]
name = "fastapi-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aqeel", email = "aqeelhanslo@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.128.8",
    "fastapi-users[sqlalchemy]>=14.0.2",
    "imagekitio>=5.13.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.39.0",
]

[project.scripts]
fastapi = "fastapi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
